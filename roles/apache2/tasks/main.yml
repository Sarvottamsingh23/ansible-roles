---
- name: Install Apache
  apt:
    name: "{{ apache_service_name }}"
    state: present
  notify: Restart Apache

- name: Deploy virtual host config
  template:
    src: vhost.conf.j2
    dest: "{{ apache_conf_dir }}/sites-available/000-default.conf"
  notify: Restart Apache

- name: Copy Index Page
  copy:
    src: index.html
    dest: /var/www/html/index.html
